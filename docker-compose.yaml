# make compose-up：运行宿主构建的单一二进制。
name: assistant
services:
  assistant:
    build:
      context: .
      dockerfile: images/review/Dockerfile
      target: review
    entrypoint: [/usr/local/bin/assistant]
    command: [run, --config, /work/config.yaml, --verbose]
    working_dir: /work
    user: "${ASSISTANT_UID:-1000}:${ASSISTANT_GID:-1000}"
    env_file: .env
    volumes:
      - ./assistant:/usr/local/bin/assistant:ro
      - ./config.yaml:/work/config.yaml:ro
      - ./data:/work/data
    restart: unless-stopped
