# 临时 MinIO（e2e / 本地试跑用）。
#
# 镜像固定为社区维护的 pgsty/minio 的「版本标签 + 摘要」：MinIO 官方已停发预编译
# 镜像（Docker Hub 的 minio/minio 已不可用），按摘要拉取才能保证每次 e2e 拿到同一份
# 二进制——现场不编译 MinIO，宿主机只需要 docker + compose。
# 换镜像：MINIO_IMAGE=别的发行版:tag ./test/minio/up.sh（替换的镜像必须自带下面的
# healthcheck 探针，否则 up.sh 的 --wait 会判定不就绪）。
name: assistant-e2e-minio

services:
  minio:
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372}
    container_name: assistant-e2e-minio
    restart: "no"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    # 就绪判定交给镜像自带的 curl 探 /minio/health/live：镜像按摘要固定，可以放心
    # 依赖它的工具面；这样宿主机不必装 curl，up.sh 也不必自己轮询。
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  minio-data:
