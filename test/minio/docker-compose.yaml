name: assistant-e2e-minio

services:
  minio:
    # MinIO 官方已归档社区仓库、停发预编译镜像（Docker Hub 的 minio/minio 已不可用）。
    # 缺省用社区维护的 pgsty/minio（保留真实 MinIO 行为）；要换别的发行版用变量覆盖：
    #   MINIO_IMAGE=adobe/s3mock:latest ./test/minio/up.sh
    # 本服务只用于本地/e2e 的对象存储后端。
    image: ${MINIO_IMAGE:-pgsty/minio:latest}
    container_name: assistant-e2e-minio
    restart: "no"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    # healthcheck 故意不写：不同发行版的镜像里未必有 mc/curl/wget，写死会假失败。
    # 就绪判断交给 up.sh 从宿主探测 /minio/health/live，不假设镜像内容。

volumes:
  minio-data:
