name: publish-image

# 构建并发布容器镜像到 GitHub Container Registry（ghcr.io）。
# 仓库级 Actions workflow 用 `container: ghcr.io/<owner>/assistant:latest`
# 运行 assistant sync / automerge，无需在步骤里下载二进制。
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            # latest：最新构建，每次 merge 到 main 都覆盖
            type=raw,value=latest,enable={{is_default_branch}}
            # stable：最后一个发布版本，仅在 push v* tag 时移动
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          # GHA 缓存加速高频构建
          cache-from: type=gha
          cache-to: type=gha,mode=max
